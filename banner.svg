<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative pink accent lines -->
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#FAC8EB" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#FAC8EB" stroke-width="1" opacity="0.2"/>

  <!-- Left decorative bracket -->
  <text x="60" y="340" font-family="monospace" font-size="180" fill="#FAC8EB" opacity="0.08">{</text>

  <!-- Right decorative bracket -->
  <text x="1080" y="340" font-family="monospace" font-size="180" fill="#FAC8EB" opacity="0.08">}</text>

  <!-- Plugin name -->
  <text x="600" y="200" font-family="sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">Alt Extend</text>

  <!-- Tagline -->
  <text x="600" y="260" font-family="sans-serif" font-weight="400" font-size="24" fill="#FAC8EB" text-anchor="middle">Configurable alt text prefix &amp; suffix for Craft CMS</text>

  <!-- Code example box -->
  <rect x="300" y="300" width="600" height="60" rx="8" fill="#FFFFFF" opacity="0.08"/>
  <text x="600" y="340" font-family="monospace" font-size="22" fill="#FFFFFF" text-anchor="middle" opacity="0.9">{{ image | alt }}</text>

  <!-- Suffix visualization -->
  <rect x="250" y="400" width="700" height="50" rx="6" fill="none" stroke="#FAC8EB" stroke-width="1.5" opacity="0.5"/>
  <text x="290" y="432" font-family="sans-serif" font-size="18" fill="#FFFFFF" opacity="0.7">Beautiful sunset over the ocean</text>
  <text x="622" y="432" font-family="sans-serif" font-size="18" fill="#FAC8EB" opacity="0.5"> | </text>
  <text x="650" y="432" font-family="sans-serif" font-weight="600" font-size="18" fill="#FAC8EB">Your Brand Name</text>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#FAC8EB"/>

  <!-- Project Joker credit -->
  <text x="600" y="622" font-family="sans-serif" font-weight="700" font-size="14" fill="#000000" text-anchor="middle" letter-spacing="1">PROJECT JOKER</text>
</svg>
